[tool.black]
line-length = 88
target-version = ["py314"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=80"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
